version: "3.9"

services:
  backend:
    build: ./apps/backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    working_dir: /app
    volumes:
      - ./apps/backend:/app
    ports:
      - "8000:8000"

  frontend:
    image: node:20
    command: sh -c "npm install && npm run dev"
    working_dir: /app
    volumes:
      - ./apps/frontend:/app
    ports:
      - "3000:3000"

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: threatguard
      POSTGRES_PASSWORD: threatguard
      POSTGRES_DB: threatguard
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"
